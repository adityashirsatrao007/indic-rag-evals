name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: CLI smoke (full offline evaluation)
        run: PYTHONPATH=src python3 -m rageval evaluate --docs data/documents --qrels data/eval/qa.jsonl --out results/
